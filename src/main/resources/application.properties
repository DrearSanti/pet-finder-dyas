spring.application.name=pet-finder
# Render asigna el puerto en PORT; en local es 8080
server.port=${PORT:8080}
# Lee .env como archivo de propiedades si existe (clave=valor). Nunca se commitea.
spring.config.import=optional:file:.env[.properties]

# Salud para el script de humo, el ping de Render y el healthcheck de Docker. info dice qué commit está
# corriendo: el despliegue espera a que muestre el SHA nuevo antes de probar, porque mientras Render cambia
# de versión la anterior sigue respondiendo sana.
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
# La imagen recibe estos valores al construirse en el pipeline (Dockerfile, ARG y ENV del mismo nombre)
info.app.commit=${PETFINDER_COMMIT:local}
info.app.version=${PETFINDER_VERSION:sin-version}
# Activa /actuator/health/readiness, que usa el HEALTHCHECK del Dockerfile
management.endpoint.health.probes.enabled=true

# Sin SPRING_DATASOURCE_URL la app usa H2 en memoria (local y pruebas): los datos se pierden al reiniciar.
# Con PostgreSQL (Compose, Render) los datos quedan en la base.
spring.datasource.url=jdbc:h2:mem:petfinder;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
# El esquema lo crea Flyway (src/main/resources/db/migration) y Hibernate solo lo compara con las
# entidades: si no coinciden, la app no arranca, en vez de crear o borrar tablas por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
# Consola de H2 apagada: en Render respondía 200 a cualquiera. Solo se prende con el
# perfil local (application-local.properties), en el computador de quien desarrolla.
spring.h2.console.enabled=false

# Código de administrador (S9): resuelve o cierra cualquier caso. Vacío = sin administrador. Si se define,
# al menos 20 caracteres (openssl rand -base64 24). Nunca se escribe en el log ni en el repositorio.
petfinder.codigo-admin=${PETFINDER_CODIGO_ADMIN:}

# Casos de ejemplo al arrancar, solo si la base no tiene ningún reporte
petfinder.datos-ejemplo=true

# Cuántos casos activos devuelve la lista (GET /api/reportes y "ver reportes"), los más recientes primero
petfinder.lista.maximo=${PETFINDER_LISTA_MAXIMO:200}
