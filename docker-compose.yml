# Pet Finder con PostgreSQL: docker compose up -d --build
# Antes, una sola vez: cp .env.example .env (y cambiar la clave)
name: pet-finder

services:
  app:
    build: .
    image: proyecto:dev
    ports:
      - "8080:8080"
    environment:
      # Spring Boot lee estas variables como spring.datasource.url, username y password.
      # "db" es el nombre del servicio de abajo: dentro del contenedor, localhost es la propia app.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-petfinder}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Defina POSTGRES_USER (ver .env.example)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD (ver .env.example)}
      # Sin SPRING_JPA_HIBERNATE_DDL_AUTO: el esquema lo crea Flyway al arrancar (db/migration) y Hibernate
      # solo lo valida. Los casos sobreviven a docker compose restart; down -v sí borra la base.
      # La consola de H2 no aplica con PostgreSQL
      SPRING_H2_CONSOLE_ENABLED: "false"
      # Asistente con Claude (opcional: sin clave funciona con reglas)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PETFINDER_IA_MODELO: ${PETFINDER_IA_MODELO:-claude-sonnet-5}
      PETFINDER_IA_TOPE_DIARIO: ${PETFINDER_IA_TOPE_DIARIO:-200}
      # Código de administrador (S9): vacío = sin administrador; si se define, 20 caracteres o más
      PETFINDER_CODIGO_ADMIN: ${PETFINDER_CODIGO_ADMIN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petfinder}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD (ver .env.example)}
    volumes:
      - datos-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  datos-db:
